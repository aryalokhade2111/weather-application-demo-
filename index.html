<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Weather App</h1>

    <!-- Search box at the top -->
    <div class="search">
      <input type="text" id="cityInput" placeholder="Enter city name">
      <button id="searchBtn">Search</button>
    </div>

    <p id="message"></p>

    <!-- Result area (always visible) -->
    <div id="result">
      <h2 id="cityName">--</h2>

      <!-- Symbol and temperature -->
      <div class="row">
        <span id="icon" class="icon">🌤️</span>
        <span id="temp" class="temp">--°C</span>
      </div>
      <p id="description">Search a city to see weather</p>

      <!-- Humidity box, separate and below -->
      <div class="humidity-box">
        <p class="humidity-label">💧 Humidity</p>
        <p id="humidity" class="humidity-value">--%</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
